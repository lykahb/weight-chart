<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weight Loss Chart - SVG</title>
  <style>
    @page {
      size: letter landscape;
      margin: 0.3in;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: Baskerville, 'Times New Roman', serif;
      color: #171717;
      background: #fff;
    }
    #app {
      padding: 12px;
      max-width: 1600px;
      margin: 0 auto;
    }
    #chart {
      display: block;
      width: 100%;
      margin: 0 auto;
      height: auto;
      font-variant-numeric: tabular-nums;
    }
    @media print {
      #app {
        padding: 0;
        max-width: none;
        break-inside: avoid;
      }
      #chart {
        width: 100%;
        /* Bound both dimensions to the printable landscape Letter area. */
        height: 7.9in;
        max-width: 10.4in;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
    #chart .bg {
      fill: #fff;
    }
    #chart .weekend {
      fill: #ededed;
    }
    #chart .month-boundary {
      stroke: #0008;
      stroke-width: 1.2;
      /* stroke-dasharray: 3 3; */
    }
    #chart .month-label {
      fill: #000;
      font-size: 24px;
      font-style: normal;
      letter-spacing: 1px;
      text-anchor: middle;
    }
    /* Small ink-style illustrations stay inside the existing header space. */
    #chart .header-art {
      color: #222;
      opacity: 0.55;
      pointer-events: none;
    }
    #chart .peony-petals {
      fill: #f5f5f5;
      stroke: currentColor;
      stroke-width: 1;
      stroke-linejoin: round;
    }
    #chart .floral-line {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #chart .weekday-label {
      fill: #333;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      text-anchor: middle;
    }
    #chart .axis-label {
      fill: #000;
      font-size: 18px;
      font-weight: bold;
      text-anchor: end;
      /* Vertically align with the markers */
      transform: translate(0, 6px);
    }
    #chart .marker-row.major {
      fill: none;
      stroke: #000;
      stroke-width: 0.8;
    }
    #chart .marker-row.integer {
      fill: none;
      stroke: #000;
      stroke-width: 0.6;
    }
    #chart .marker-row.fraction {
      fill: #000;
      stroke: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <svg
      id="chart"
      aria-label="Weight chart"
      role="img"
      xmlns="http://www.w3.org/2000/svg"
      :view-box.camel="viewBox"
      :preserve-aspect-ratio.camel="'xMinYMin meet'"
    >
      <rect class="bg" :x="0" :y="0" :width="chartWidth" :height="chartHeight" />

      <defs>
        <!-- Layered peony petals and a trailing stem stay within the header. -->
        <g id="peony-sprig">
          <path class="floral-line" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M18 24 C30 36 46 35 62 28 Q71 24 75 29
            M38 33 Q36 24 31 23 Q30 30 38 33
            M48 32 Q50 23 57 22 Q56 29 48 32" />
          <g class="peony-petals" fill="#f5f5f5" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
            <path d="M18 28 C12 32 7 29 7 25 C0 25 0 19 4 16
              C0 11 4 6 9 7 C9 1 15 0 19 4 C23 0 29 2 29 7
              C35 5 39 10 35 15 C40 19 36 25 31 24 C30 31 23 32 18 28Z" />
            <path d="M18 25 C11 27 8 22 11 18 C5 14 10 9 15 11
              C14 5 22 5 24 10 C30 7 34 13 29 17 C34 22 27 27 23 24
              Q20 29 18 25Z" />
            <path d="M16 21 C11 18 15 13 19 15 C20 10 27 13 25 17
              C29 21 22 24 20 21 Q16 24 16 21Z" />
          </g>
          <path class="floral-line" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M18 18 Q21 15 23 18 Q24 21 20 20" />
        </g>
        <path id="vine-leaf" fill="#f5f5f5" stroke="currentColor" stroke-width="1"
          d="M0 0 Q-3 -8 5 -11 Q8 -3 0 0Z" />
        <path id="sparkle" fill="currentColor"
          d="M0 -5 Q1 -1 4 0 Q1 1 0 5 Q-1 1 -4 0 Q-1 -1 0 -5Z" />
        <g id="marker-major-type"><circle :cx="0" :cy="0" :r="3.0" /></g>
        <g id="marker-integer-type"><circle :cx="0" :cy="0" :r="2.0" /></g>
        <g id="marker-fraction-type"><circle :cx="0" :cy="0" :r="0.5" /></g>

        <g id="marker-major-template">
          <use
            v-for="c in totalDays"
            :key="`major-${c}`"
            href="#marker-major-type"
            :transform="`translate(${axisWidth + (c - 1) * dayWidth + dayWidth / 2} 0)`"
          />
        </g>
        <g id="marker-integer-template">
          <use
            v-for="c in totalDays"
            :key="`integer-${c}`"
            href="#marker-integer-type"
            :transform="`translate(${axisWidth + (c - 1) * dayWidth + dayWidth / 2} 0)`"
          />
        </g>
        <g id="marker-fraction-template">
          <use
            v-for="c in totalDays"
            :key="`fraction-${c}`"
            href="#marker-fraction-type"
            :transform="`translate(${axisWidth + (c - 1) * dayWidth + dayWidth / 2} 0)`"
          />
        </g>
      </defs>

      <rect
        v-for="c in weekendColumns"
        :key="`weekend-${c}`"
        class="weekend"
        :x="axisWidth + c * dayWidth"
        :y="monthHeaderHeight"
        :width="dayWidth"
        :height="chartHeight - monthHeaderHeight"
      />

      <g v-for="(m, i) in monthLayout" :key="`month-${i}`">
        <g class="header-art" aria-hidden="true">
          <use href="#peony-sprig" :transform="`translate(${m.x + 10} 2)`" />
          <!-- Each month adds a leaf, up to a full six-leaf vine. -->
          <g class="growing-vine" :transform="`translate(${m.x + m.width - 76} 2)`">
            <path class="floral-line"
              :d="`M0 33 Q${Math.min(i + 1, 6) * 4.5} 33 ${Math.min(i + 1, 6) * 9} ${33 - Math.min(i + 1, 6) * 3}`" />
            <!-- Sample the quadratic stem at t = leaf / leafCount. -->
            <use v-for="leaf in Math.min(i + 1, 6)" :key="`leaf-${leaf}`"
              href="#vine-leaf"
              :transform="`translate(${leaf * 9} ${33 - 3 * leaf * leaf / Math.min(i + 1, 6)}) rotate(${leaf % 2 ? -25 : 100})`" />
          </g>
          <use v-if="i % 2 === 0" href="#sparkle"
            :transform="`translate(${m.x + 63} 10)`" />
          <use v-if="i % 2 === 1" href="#sparkle"
            :transform="`translate(${m.x + m.width - 23} 9) scale(.7)`" />
        </g>
        <text
          class="month-label"
          :x="m.x + m.width / 2"
          :y="monthHeaderHeight / 2 + 10"
        >{{ m.name }}</text>
        <line
          v-if="i > 0"
          class="month-boundary"
          :x1="m.x"
          :y1="monthHeaderHeight"
          :x2="m.x"
          :y2="chartHeight"
        />
      </g>

      <text
        v-for="c in totalDays"
        :key="`weekday-${c}`"
        class="weekday-label"
        :x="axisWidth + (c - 1) * dayWidth + dayWidth / 2"
        :y="monthHeaderHeight + (weekdayHeaderHeight / 2) + 2"
      >{{ weekdayNames[(startDay + (c - 1)) % 7] }}</text>

      <g v-for="row in markerRows" :key="`row-${row.r}`">
        <use
          :href="row.templateId"
          :transform="`translate(0 ${row.y})`"
          :class="`marker-row ${row.markerClass}`"
        />
        <text
          v-if="row.axisLabel !== null"
          class="axis-label"
          :x="axisWidth - 8"
          :y="row.y"
        >{{ row.axisLabel }}</text>
      </g>
    </svg>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        const startYear = 2026;
        const startMonth = 10; // 1-12
        const durationMonths = 6;
        const weightLower = 140;
        const weightUpper = 175;
        const weightStep = 0.2;
        const weekdayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        const monthNames = [
          'January', 'February', 'March', 'April', 'May', 'June',
          'July', 'August', 'September', 'October', 'November', 'December'
        ];

        const startDate = new Date(startYear, startMonth - 1, 1);
        const endDate = new Date(startYear, startMonth - 1 + durationMonths, 0);

        return {
          startDate,
          endDate,
          weightLower,
          weightUpper,
          weightStep,
          weekdayNames,
          monthNames,
          axisWidth: 50,
          monthHeaderHeight: 40,
          weekdayHeaderHeight: 30,
          dayCellWidth: 10,
          rowCellHeight: 7
        };
      },
      computed: {
        months() {
          const monthGroups = [];
          for (let d = new Date(this.startDate); d <= this.endDate; d.setDate(d.getDate() + 1)) {
            const monthIndex = d.getMonth();
            const last = monthGroups[monthGroups.length - 1];
            if (!last || last.monthIndex !== monthIndex) monthGroups.push({ monthIndex, days: 1 });
            else last.days += 1;
          }
          return monthGroups.map(({ monthIndex, days }) => ({
            name: this.monthNames[monthIndex],
            days
          }));
        },
        totalDays() {
          const msPerDay = 24 * 60 * 60 * 1000;
          return Math.floor((this.endDate - this.startDate) / msPerDay) + 1;
        },
        startDay() {
          return this.startDate.getDay();
        },
        steps() {
          return Math.round((this.weightUpper - this.weightLower) / this.weightStep);
        },
        chartWidth() {
          return this.axisWidth + this.totalDays * this.dayCellWidth;
        },
        bodyHeight() {
          return (this.steps + 1) * this.rowCellHeight;
        },
        chartHeight() {
          return this.monthHeaderHeight + this.weekdayHeaderHeight + this.bodyHeight;
        },
        viewBox() {
          return `0 0 ${this.chartWidth} ${this.chartHeight}`;
        },
        dayWidth() {
          return (this.chartWidth - this.axisWidth) / this.totalDays;
        },
        rowHeight() {
          return this.bodyHeight / (this.steps + 1);
        },
        weekendColumns() {
          const cols = [];
          for (let c = 0; c < this.totalDays; c++) {
            const idx = (this.startDay + c) % 7;
            if (idx === 0 || idx === 6) cols.push(c);
          }
          return cols;
        },
        monthLayout() {
          let dayCursor = 0;
          return this.months.map((m) => {
            const x = this.axisWidth + dayCursor * this.dayWidth;
            const width = m.days * this.dayWidth;
            dayCursor += m.days;
            return { name: m.name, x, width };
          });
        },
        markerRows() {
          const rows = [];
          for (let r = 0; r <= this.steps; r++) {
            const wVal = this.weightUpper - r * this.weightStep;
            const { axisLabel, markerClass, templateId } = this.classifyWeightRow(wVal);
            rows.push({
              r,
              y: this.monthHeaderHeight + this.weekdayHeaderHeight + r * this.rowHeight,
              axisLabel,
              markerClass,
              templateId
            });
          }
          return rows;
        }
      },
      methods: {
        classifyWeightRow(wVal) {
          const rounded = Math.round(wVal);
          const epsilon = 1e-9;
          const isInteger = Math.abs(wVal - rounded) < epsilon;
          const isMajor = isInteger && (rounded % 5 === 0);
          const markerClass = isMajor ? 'major' : (isInteger ? 'integer' : 'fraction');
          const templateId = isMajor
            ? '#marker-major-template'
            : (isInteger ? '#marker-integer-template' : '#marker-fraction-template');
          const axisLabel = isMajor ? String(rounded) : null;
          return { axisLabel, markerClass, templateId };
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
